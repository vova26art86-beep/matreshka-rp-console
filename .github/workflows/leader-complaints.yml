name: Matreshka leader complaints → VK

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: leader-complaints-vk-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Check complaints and notify VK
        env:
          VK_GROUP_TOKEN: ${{ secrets.VK_GROUP_TOKEN }}
        run: python monitoring/leader_complaints.py

      - name: Save monitoring state
        run: |
          if ! git diff --quiet -- monitoring/state.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add monitoring/state.json
            git commit -m "chore: update leader complaints monitor state"
            git push
          fi
